<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda de calls · Gravaê</title>
  <link rel="icon" href="../icones/32.png">
  <link rel="stylesheet" href="../estilo/gravae.css">
  <link rel="stylesheet" href="agenda.css">
</head>
<body>
  <header class="barra">
    <div class="marca">
      <img src="../icones/48.png" alt="">
      <div><h1>Agenda de calls</h1><span>Gravaê</span></div>
    </div>
    <div class="nav">
      <button id="hoje" type="button">Hoje</button>
      <button id="anterior" class="seta" type="button" aria-label="Anterior">‹</button>
      <button id="proximo" class="seta" type="button" aria-label="Próximo">›</button>
      <h2 id="periodo"></h2>
    </div>
    <div class="direita">
      <div class="visao" role="group" aria-label="Visão">
        <button type="button" data-visao="semana">Semana</button>
        <button type="button" data-visao="dia">Dia</button>
      </div>
      <input id="busca" type="search" placeholder="Buscar nas transcrições" autocomplete="off">
    </div>
  </header>

  <div class="corpo">
    <aside class="lateral">
      <div class="mini cartao">
        <div class="mini-topo">
          <strong id="mini-mes"></strong>
          <span><button id="mini-ant" class="seta pequena" type="button" aria-label="Mês anterior">‹</button><button id="mini-prox" class="seta pequena" type="button" aria-label="Próximo mês">›</button></span>
        </div>
        <div id="mini-grade" class="mini-grade"></div>
      </div>
      <div id="numeros" class="numeros"></div>
      <div id="resultados" class="resultados" hidden></div>
    </aside>

    <main class="calendario">
      <div class="cabecalho-dias" id="cabecalho"></div>
      <div class="rolagem" id="rolagem">
        <div class="grade" id="grade"></div>
      </div>
      <div id="vazio" class="vazio" hidden>Nenhuma call nesta semana. As chamadas do Google Meet aparecem aqui sozinhas, com a transcrição e o resumo do copiloto.</div>
    </main>

    <aside id="detalhe" class="detalhe" hidden>
      <div class="detalhe-topo">
        <button id="fechar" class="discreto" type="button" aria-label="Fechar">✕</button>
        <div class="acoes">
          <a id="abrir-meet" target="_blank" rel="noopener">Abrir no Meet</a>
          <button id="baixar" type="button">Baixar .md</button>
          <button id="copiar" type="button">Copiar</button>
          <button id="apagar" class="perigo" type="button">Apagar</button>
        </div>
      </div>
      <div class="detalhe-rolagem">
        <h2 id="d-titulo"></h2>
        <p id="d-quando" class="quando"></p>
        <div id="d-pessoas" class="pessoas"></div>
        <div id="d-numeros" class="d-numeros"></div>
        <nav class="abas" role="tablist">
          <button type="button" data-aba="resumo" role="tab">Resumo do copiloto</button>
          <button type="button" data-aba="transcricao" role="tab">Transcrição</button>
        </nav>
        <section id="aba-resumo" class="aba">
          <div id="d-resumo" class="md"></div>
          <div id="d-sem-resumo" class="sem-resumo cartao" hidden>
            <p id="d-sem-resumo-texto"></p>
            <button id="gerar" class="principal" type="button">Gerar o resumo agora</button>
          </div>
        </section>
        <section id="aba-transcricao" class="aba" hidden>
          <input id="d-busca" type="search" placeholder="Buscar nesta call" autocomplete="off">
          <ol id="d-falas" class="falas"></ol>
        </section>
      </div>
    </aside>
  </div>

  <script src="../lib/formato.js"></script>
  <script src="../lib/markdown.js"></script>
  <script src="agenda.js"></script>
</body>
</html>
